# Server blocks for the marketing site (saidentalclinicylk.com). Adjust root/ssl paths to your server.
server {
    listen 80;
    server_name saidentalclinicylk.com www.saidentalclinicylk.com;
    return 301 https://saidentalclinicylk.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.saidentalclinicylk.com;
    # ssl_certificate / ssl_certificate_key as for the main block
    return 301 https://saidentalclinicylk.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name saidentalclinicylk.com;
    root /var/www/saidentalclinicylk;   # <-- folder containing index.html
    index index.html;
    # ssl_certificate ...; ssl_certificate_key ...;

    server_tokens off;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://maps.google.com https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # block dotfiles, backups, logs
    location ~ /\.            { deny all; }
    location ~* \.(env|git|bak|sql|log|zip|tar|gz|map|conf)$ { deny all; }

    location /images/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ =404; }
}
# NOTE: add_header inside a location block drops the server-level headers; repeat them there if you add more locations.
